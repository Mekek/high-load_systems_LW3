spring:
  config:
    import: ""
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  liquibase:
    enabled: false

eureka:
  client:
    enabled: false

testcontainers:
  postgresql:
    image: ${POSTGRES_IMAGE:postgres:15-alpine}

openapi:
  server-url: http://localhost:8080

security:
  jwt:
    secret: test-poster-jwt-secret-with-at-least-32-bytes
    expiration-seconds: 3600
